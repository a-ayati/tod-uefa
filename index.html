<meta name="twitter:title" content="دوري أبطال أوروبا على TOD">
<meta name="twitter:description" content="UEFA Champions League on TOD. Campaign presentation by Abdelouahed Ayati.">
<meta name="twitter:image" content="https://a-ayati.github.io/tod-uefa/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1423;--yellow:#FFBC00;--ar:"Alexandria","Geeza Pro",Tahoma,sans-serif;--en:"Alexandria","Helvetica Neue",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1423}}
:root[data-theme="dark"]{--bg:#0C1423}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg)}
[hidden]{display:none!important}

.switch{position:fixed;z-index:9999;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;
  background:rgba(255,188,0,.38);backdrop-filter:blur(24px) saturate(170%) brightness(1.12);-webkit-backdrop-filter:blur(24px) saturate(170%) brightness(1.12);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);border:1px solid rgba(255,188,0,.7);border-radius:40px;
  padding:11px 18px 11px 14px;font:700 15px/1 var(--ar);cursor:pointer;box-shadow:0 10px 34px -12px rgba(0,0,0,.65);transition:transform .2s,background .2s,bottom .3s ease}
html[lang="en"] .switch{font-family:var(--en);font-size:14px}
.switch:hover{transform:translateY(-2px);background:rgba(255,188,0,.4)}
.switch:focus-visible{outline:3px solid #fff;outline-offset:3px}
.switch .ic{width:30px;height:30px;border-radius:50%;background:var(--yellow);color:#101010;display:grid;place-items:center;flex:none;position:relative}
.switch .ic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--yellow);opacity:0;animation:pulse 2.2s ease-out 1.2s 3}
@keyframes pulse{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
.wipe{position:fixed;inset:0;z-index:9998;background:var(--yellow);pointer-events:none;clip-path:circle(0 at 50% 50%)}
@media (max-width:900px){body.mode-land.sticky-on .switch{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}
.switch{padding:6px 14px 6px 6px;font-size:13px;gap:8px}
html[lang="en"] .switch{font-size:12.5px}
.switch .ic{width:28px;height:28px}
.switch .ic svg{width:15px;height:15px}
#sw-t{white-space:nowrap;overflow:hidden;line-height:1.7;padding-block:.35em;margin-block:-.35em;max-width:220px;transition:max-width .35s ease,opacity .25s ease}
@media (max-width:900px){
  .switch{padding:5px;gap:0}
  .switch .ic{width:34px;height:34px}
  #sw-t{max-width:0;opacity:0}
  .switch.peek{padding:5px 14px 5px 5px;gap:8px}
  .switch.peek #sw-t{max-width:220px;opacity:1}
}
@media (hover:hover) and (max-width:900px){
  .switch:hover{padding:5px 14px 5px 5px;gap:8px}
  .switch:hover #sw-t{max-width:220px;opacity:1}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.switch,.switch .ic::after{transition:none;animation:none}}
</style>
</head>
<body>

<div id="h-show"></div>
<div id="h-land" hidden></div>
<div class="wipe" id="wipe" aria-hidden="true"></div>
<button class="switch" id="switch" type="button">
  <span class="ic" id="sw-ic" aria-hidden="true"></span>
  <span id="sw-t"></span>
</button>

<template id="t-show"><style>
:host{display:block;background:var(--bg);
  --bg:#0C1423; --bg2:#262861; --card:#262861; --line:rgba(255,255,255,.1);
  --violet:#5B308E; --violet2:#5B308E; --yellow:#FFBC00; --text:#FFFFFF; --muted:rgba(215,214,214,.74);
  --ar:"Alexandria","Geeza Pro",Tahoma,sans-serif; --en:"Alexandria","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The page mirrors a streaming site, which is dark in both themes */


*,*::before,*::after{box-sizing:inherit}

.page{margin:0;background:var(--bg);color:var(--text);font-family:var(--ar);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:host([lang="en"]) .page{font-family:var(--en)}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:6px}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,rgba(12,20,35,.96),rgba(12,20,35,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:28px;height:68px}
.logo{font-family:var(--en);font-weight:900;font-size:30px;letter-spacing:-.04em;color:var(--yellow);line-height:1;display:flex;flex-direction:column;align-items:flex-start}
.logo small{font-size:9px;font-weight:600;color:#fff;letter-spacing:0;margin-top:-2px;align-self:flex-end}
.logo img{display:block;height:44px;width:auto}
.tod-mark{display:inline-block;height:.68em;width:auto;vertical-align:-.05em;margin-inline:.16em}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-weight:500;font-size:15px}
nav a{color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
nav a[aria-current]{color:#fff;border-color:var(--yellow)}
.topbar .end{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.icon-btn{background:none;border:0;cursor:pointer;padding:6px;display:grid;place-items:center;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 20px;font-weight:700;font-size:15px;border:0;cursor:pointer;white-space:nowrap}
.btn.y{background:var(--yellow);color:#101010}
.btn.g{background:rgba(255,255,255,.12);color:#fff}
.btn.o{background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff}
.lang{font-weight:700;font-size:14px;background:none;border:0;cursor:pointer;color:#fff;padding:6px}

/* Hero */
.hsound{position:absolute;z-index:4;top:16px;inset-inline-end:20px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(12,20,35,.55);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.hsound[hidden]{display:none}
.hsound:hover,.hsound:focus-visible{background:var(--yellow);color:#101010;transform:scale(1.06)}
.hsound svg{width:19px;height:19px}.hsound svg[hidden]{display:none}
.hsound.hint::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--yellow);animation:hpulse 2s ease-out 1s 4;opacity:0}
@keyframes hpulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.hero{position:relative;background:#000}
.hero .media{position:relative;aspect-ratio:16/9;max-height:78vh;width:100%;overflow:hidden}
.hero .media>img,.hero .media>video{width:100%;height:100%;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(12,20,35,.55) 22%,transparent 50%);pointer-events:none}
.hero .info{position:absolute;inset-inline:0;bottom:0;padding-bottom:40px}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin-bottom:14px;backdrop-filter:blur(8px)}
.tag i{width:8px;height:8px;border-radius:50%;background:#E0298C;box-shadow:0 0 0 3px rgba(224,41,140,.25)}
.hero h1{margin:0 0 10px;font-size:clamp(26px,3.4vw,44px);font-weight:800;line-height:1.35}
.hero p{margin:0 0 20px;color:#D7D6D6;max-width:52ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.dots{position:absolute;bottom:18px;inset-inline-end:32px;display:flex;gap:6px}
.dots b{width:22px;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}
.dots b:first-child{background:var(--yellow)}

/* Rails */
section{padding-top:40px}
.rail-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:22px;direction:ltr;margin-bottom:22px}
.rail-h .ln{height:3px;border-radius:3px;background:var(--yellow);box-shadow:0 0 14px rgba(255,188,0,.5)}
.rail-h .ln.l{transform-origin:left center}
.rail-h .ln.r{transform-origin:right center}
.rail-h.arm .ln{transform:scaleX(0);transition:transform 1s cubic-bezier(.22,1,.36,1)}
.rail-h.arm h2{opacity:0;transform:translateY(28px);transition:opacity .7s ease .1s,transform .8s cubic-bezier(.22,1,.36,1) .1s}
.rail-h.arm.in .ln{transform:scaleX(1)}
.rail-h.arm.in h2{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rail-h.arm .ln,.rail-h.arm h2{transition:none}}
.rail-h h2{margin:0;font-size:clamp(20px,2.2vw,26px);font-weight:800;text-align:center;direction:ltr}
:host([dir="rtl"]) .rail-h h2{direction:rtl}
.rail{display:grid;grid-auto-flow:column;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.rail.v{grid-auto-columns:minmax(300px,400px)}
.rail.v{width:max-content;max-width:100%;margin-inline:auto}
.tile{position:relative;border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer;border:0;padding:0;text-align:start;display:block;width:100%}
.tile .th{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--card)}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.tile:hover img,.tile:hover video{transform:scale(1.04)}
.th:has(.slot)+.play{display:none}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 60%)}
.tile .play span{width:52px;height:52px;border-radius:50%;background:rgba(255,188,0,.95);display:grid;place-items:center;color:#101010}
.dur{position:absolute;bottom:8px;inset-inline-end:8px;font:700 12px var(--en);background:rgba(0,0,0,.7);padding:2px 7px;border-radius:4px}
.tile .meta{padding:12px 14px 14px}
.tile .meta b{display:block;font-size:16px}
.tile .meta span{color:var(--muted);font-size:13px}

/* Formats grid */
.dcar{width:100%}
.dc-view.fill{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;background:none}
.st-car .dc-view{aspect-ratio:9/16}
.hd-car .dc-view{aspect-ratio:16/9}
.dc-view{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--card)}
.dc-slide{position:absolute;inset:0;margin:0;opacity:0;transform:scale(.97);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.dc-slide.on{opacity:1;transform:none;pointer-events:auto}
.dc-img{position:absolute;inset:0;cursor:zoom-in;background:var(--card)}
.dc-img img{width:100%;height:100%;object-fit:cover;display:block}
.dc-slide figcaption{display:flex;justify-content:space-between;gap:12px;margin:12px 4px 0;font-size:14px;color:var(--muted)}
.dc-slide figcaption b{color:#fff;font-weight:700}
.dc-ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
.dc-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--yellow);background:rgba(255,188,0,.12);color:var(--yellow);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.dc-btn:hover,.dc-btn:focus-visible{background:var(--yellow);color:#101010}
.dc-btn svg{width:15px;height:15px}
:host([dir="rtl"]) .dc-btn svg{transform:scaleX(-1)}
.dc-dots{display:flex;gap:8px}
.dc-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s,width .3s}
.dc-dots i.on{background:var(--yellow);width:22px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.dc-slide{transition:none}}
.formats{display:grid;grid-template-columns:1fr .5625fr 1.7778fr;gap:14px;align-items:start;max-width:1060px;margin:0 auto}
.fmt{min-width:0;flex-basis:0}
.fmt.sq{flex-grow:1}.fmt.st{flex-grow:.5625}.fmt.hd{flex-grow:1.7778}
.fmt .th{border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer;position:relative}
.fmt.sq .th{aspect-ratio:1/1}.fmt.st .th{aspect-ratio:9/16}.fmt.hd .th{aspect-ratio:16/9}
.fmt .th img{width:100%;height:100%;object-fit:cover;display:block}
.fmt p{display:flex;gap:8px;margin:10px 2px 0;font-size:14px;color:var(--muted)}
.fmt p b{color:#fff;margin-inline-end:6px}

/* In context: phone */
.context{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;background:linear-gradient(135deg,var(--violet) 0%,var(--bg2) 70%);border-radius:18px;padding:40px;margin-top:8px;overflow:hidden}
.phone{width:260px;border-radius:30px;background:#101010;padding:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7),inset 0 0 0 1.5px #262861,0 0 0 1px rgba(255,255,255,.16)}
.phone .scr{position:relative;width:100%;aspect-ratio:9/19.5;border-radius:24px;overflow:hidden;background:#000}
.phone .scr img{width:100%;height:100%;object-fit:cover}
.phone .sbar{position:absolute;top:0;left:0;right:0;height:10%;display:flex;align-items:center;justify-content:space-between;padding:0 7%;color:#fff;font-size:9px;font-weight:700;direction:ltr;z-index:3}
.phone .cam{position:absolute;left:50%;top:34%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#050505;box-shadow:0 0 0 1.5px #1a1a1a}
.phone .sic{display:flex;gap:4px;align-items:center}.phone .sic svg{width:11px;height:11px}
.phone .gnav{position:absolute;bottom:2.8%;left:50%;width:34%;height:3px;margin-left:-17%;border-radius:3px;background:rgba(255,255,255,.85);z-index:3}
.phone .bar{position:absolute;top:calc(10% + 6px);inset-inline:10px;display:flex;gap:3px;z-index:2}
.phone .bar i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.4)}
.phone .bar i.done{background:#fff}
.phone .bar i.on{position:relative;overflow:hidden}
.phone .bar i.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left center;animation:sfill 4.5s linear forwards}
:host([dir="rtl"]) .phone .bar i.on::after{transform-origin:right center}
@keyframes sfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.phone .bar i.on::after{animation:none}}
.phone .dc-view.fill{top:10.1%;bottom:7.9%;height:auto}
.context{grid-template-columns:1fr 1.15fr;gap:32px;padding:44px 44px 44px;position:relative;isolation:isolate}
.context .copy{position:relative;z-index:2}
.ctx-chips{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:22px 0 0;padding:0}
.ctx-chips li{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:7px 14px;font-size:13px;color:#FFFFFF}
.ctx-chips b{color:var(--yellow);font-weight:800}
.stack{position:relative;height:500px;min-width:0}
.stack .orb{position:absolute;border-radius:50%;filter:blur(40px);z-index:0;pointer-events:none}
.stack .o1{width:240px;height:240px;background:rgba(255,188,0,.2);left:50%;top:50%;margin:-120px 0 0 -120px}
.stack .o2{display:none}
.stack .ring{position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;border:1.5px dashed rgba(255,188,0,.22);animation:spin 40s linear infinite;z-index:0}
.stack .phone{position:absolute;left:50%;top:50%;width:220px;margin:-231px 0 0 -110px;z-index:3;animation:flt 6s ease-in-out infinite}
.stack .card{position:absolute;border-radius:16px;padding:6px;background:#262861;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 26px 50px -22px rgba(0,0,0,.8);z-index:2}
.stack .card .th{border-radius:11px;overflow:hidden;background:var(--card);position:relative;cursor:pointer}
.stack .card .th img,.stack .card .th video{width:100%;height:100%;object-fit:cover;display:block}
.stack .hdc{width:340px;inset-inline-start:-4%;top:6%;transform:rotate(-7deg);animation:flt2 7s ease-in-out infinite}
.stack .hdc .th{aspect-ratio:16/9}
.stack .sqc{width:230px;inset-inline-end:0;bottom:2%;transform:rotate(6deg);animation:flt3 8s ease-in-out infinite}
.stack .sqc .th{aspect-ratio:1/1}
.stack .acts{position:absolute;z-index:4;inset-inline-start:calc(50% - 184px);top:50%;margin-top:-20px;display:flex;flex-direction:column;gap:12px}
.stack .act{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);color:#101010;box-shadow:0 10px 22px -10px rgba(0,0,0,.7)}
.stack .act svg{width:21px;height:21px}
.stack .act.like{background:var(--yellow)}
.stack .acts{animation:flt 5s ease-in-out infinite}
.stack .bub{position:absolute;z-index:4;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#101010;box-shadow:0 12px 26px -10px rgba(0,0,0,.7)}
.stack .bub svg{width:22px;height:22px}
.stack .b1{left:34%;top:4%;animation:flt 5s ease-in-out infinite}
.stack .b2{inset-inline-start:6%;top:12%;background:#fff;animation:flt 6s ease-in-out infinite}
.stack .b3{inset-inline-end:8%;bottom:10%;background:var(--yellow);animation:flt 5.500s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes flt2{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(-5deg) translateY(-10px)}}
@keyframes flt3{0%,100%{transform:rotate(6deg) translateY(0)}50%{transform:rotate(4deg) translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.stack *{animation:none!important}}
.context h2{margin:0 0 10px;font-size:28px;font-weight:800}
.context p{margin:0 0 18px;color:#D7D6D6;max-width:50ch}

/* About */
.brief{display:none;margin-top:32px;padding:36px;border-radius:18px;background:linear-gradient(135deg,rgba(91,48,142,.35),rgba(38,40,97,.55));border:1px solid rgba(255,255,255,.12)}
.brief .kick{display:inline-block;color:var(--yellow);font-weight:800;font-size:13px;letter-spacing:.04em;margin-bottom:8px}
.brief h2{margin:0 0 22px;font-size:clamp(24px,3vw,36px);font-weight:800;line-height:1.4}
:host([data-view="brief"]) .brief{display:block}
:host([data-view="brief"]) main>.hero,:host([data-view="brief"]) main .wrap>section:not(.brief){display:none}
.bf-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.bf-blk h3,.bf-end h3,.bf-h4{margin:0 0 10px;font-size:19px;font-weight:800;color:var(--yellow);line-height:1.5}
.bf-blk h3.gap{margin-top:26px}
.brief p{margin:0 0 12px;color:#D7D6D6;line-height:1.95;font-size:15.5px}
.bf-fig{margin:18px 0 0}
.bf-fig img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#D7D6D6}
.bf-fig figcaption{margin-top:10px;color:var(--muted);font-size:13.5px;text-align:center}
.bf-more{margin-top:28px;border-top:1px solid var(--line);padding-top:22px}
.bf-more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:#101010;font-weight:800;border-radius:10px;padding:10px 20px;font-size:15px}

[hidden]{display:none!important}

.page{margin:0;background:var(--bg);color:var(--text);font-family:var(--ar);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
:host([lang="en"]) .page{font-family:var(--en);font-size:16px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:14px 26px;font-weight:800;font-size:17px;border:0;cursor:pointer;white-space:nowrap}
.btn span{line-height:1.25}
.btn .arr{width:1.15em;height:1.15em;flex:none}
:host([dir="rtl"]) .btn .arr{transform:scaleX(-1)}
.btn.y{background:var(--yellow);color:#101010}
.btn.sm{padding:9px 18px;font-size:15px;border-radius:8px}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}

/* Header */
header{position:fixed;top:0;inset-inline:0;z-index:30;padding-top:env(safe-area-inset-top,0px);transition:background .25s}
header.solid{background:rgba(12,20,35,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:68px}
.logo{font-family:var(--en);font-weight:900;font-size:30px;letter-spacing:-.04em;color:var(--yellow);line-height:1;display:flex;flex-direction:column}
.logo small{font-size:9px;font-weight:600;color:#fff;letter-spacing:0;margin-top:-2px;align-self:flex-end}
.logo img{display:block;height:44px;width:auto}
.tod-mark{display:inline-block;height:.68em;width:auto;vertical-align:-.05em;margin-inline:.16em}
.bar .end{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.lang{background:none;border:0;cursor:pointer;color:#fff;font-weight:700;padding:6px}

/* Hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:#000}
.hero .media{position:absolute;inset:0}
.hero .media img,.hero .media video{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(12,20,35,.7) 30%,rgba(12,20,35,0) 62%),linear-gradient(180deg,rgba(12,20,35,.6),transparent 20%);pointer-events:none}
.hero .copy{position:relative;z-index:2;width:100%;padding-bottom:64px}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin-bottom:16px;backdrop-filter:blur(8px)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.hero h1{margin:0 0 18px;font-size:clamp(30px,4.1vw,54px);font-weight:800;line-height:1.3;max-width:16ch}
:host([lang="en"]) .hero h1{letter-spacing:-.03em}
.hero p{margin:0 0 26px;font-size:clamp(17px,1.6vw,20px);color:#D7D6D6;max-width:44ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sound{position:absolute;z-index:3;bottom:64px;inset-inline-end:28px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer}

/* Benefits */
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.benefit{padding:26px 24px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px}
.benefit svg{color:var(--yellow);margin-bottom:12px}
.benefit b{display:block;font-size:19px;margin-bottom:4px}
.benefit span{color:var(--muted);font-size:15px}

section{padding:88px 0 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.frame{position:relative;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
.frame.sq{aspect-ratio:1/1}
.frame.hd{aspect-ratio:16/9}
.frame img,.frame video{width:100%;height:100%;object-fit:cover;display:block}
h2{margin:0 0 14px;font-size:clamp(28px,3.3vw,42px);font-weight:800;line-height:1.3}
.lead{margin:0 0 24px;color:var(--muted);font-size:18px;max-width:46ch}
.points{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:18px}
.points li{display:block}
.points li b{display:block;font-weight:800}

/* Devices */
.devices{text-align:center}
.devices .lead{margin-inline:auto;white-space:pre-line}
.tv{max-width:880px;margin:36px auto 0}
.tv .frame{border-radius:14px;border:8px solid #262861}
.tv .stand{width:28%;height:10px;margin:0 auto;background:#262861;border-radius:0 0 8px 8px}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.chips span{border:1px solid var(--line);border-radius:30px;padding:8px 16px;font-size:15px;color:#D7D6D6}

/* FAQ */
.faq{max-width:780px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:22px 0;font-weight:700;font-size:19px;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--yellow);font-size:26px;line-height:1;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:0 0 22px;color:var(--muted)}

/* Final CTA */
.final{margin-top:96px;position:relative;overflow:hidden;min-height:440px;padding-block:56px;display:flex;align-items:center}
.final .media{position:absolute;inset:0}
.final .media img{width:100%;height:100%;object-fit:cover}
.final::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,20,35,.2),rgba(12,20,35,.92) 65%)}
:host([dir="rtl"]) .final::after{background:linear-gradient(270deg,rgba(12,20,35,.2),rgba(12,20,35,.92) 65%)}
.final .wrap{position:relative;z-index:2;width:100%}
.final .inner{max-width:660px;margin-inline-start:auto}
.final h2{white-space:pre-line;font-size:clamp(24px,2.7vw,34px);line-height:1.4}
:host([lang="en"]) .final h2{font-size:clamp(24px,2.8vw,36px)}
.final .lockup{display:flex;flex-direction:column;align-items:center;width:max-content;margin:0 0 30px}
.final .lk-t{color:var(--yellow);font-weight:800;font-size:clamp(18px,1.9vw,24px);line-height:1.5;margin-bottom:2px}
:host([lang="en"]) .final .lk-t{letter-spacing:.06em;line-height:1.2;margin-bottom:6px}
.final .lockup img{display:block;width:clamp(130px,13vw,180px);height:auto}
.final .lead{font-size:clamp(36px,4.6vw,58px);font-weight:800;color:var(--yellow);line-height:1.35;max-width:none;margin:0 0 30px}
:host([lang="en"]) .final .lead{font-size:clamp(30px,3.8vw,48px)}

footer{padding:32px 0 110px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* Sticky mobile CTA */
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(12,20,35,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;transform:translateY(100%);transition:transform .3s}
.sticky.show{transform:none}
.sticky .btn{width:100%}

/* Placeholder */
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(90% 90% at 70% 10%,#5B308E,var(--bg2) 60%,#0C1423);color:rgba(255,255,255,.55);font-size:13px}
.ph b{display:block;font:700 13px var(--en);color:rgba(255,255,255,.8)}
.ph label{display:inline-block;margin-top:8px;background:rgba(255,255,255,.1);border-radius:6px;padding:4px 10px;cursor:pointer;color:#fff}
.ph input{position:absolute;width:1px;height:1px;opacity:0}
.hero .ph{place-items:start center;padding-top:120px}


/* ===== Interactive layer ===== */
.prog{position:absolute;bottom:-1px;inset-inline:0;height:3px;background:var(--yellow);transform:scaleX(var(--sp,0));transform-origin:right center;box-shadow:0 0 12px rgba(255,188,0,.7)}
:host([dir="ltr"]) .prog{transform-origin:left center}
.hero .media{transform:scale(calc(1 + var(--p,0)*.14));transform-origin:center;will-change:transform}
.hero .copy{opacity:calc(1 - var(--p,0)*1.4);transform:translateY(calc(var(--p,0)*-40px))}
.spot{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx,70%) var(--my,30%),rgba(255,188,0,.30),rgba(255,188,0,.08) 45%,transparent 70%)}
.hero:hover .spot{opacity:1}
@media (hover:none){.spot{display:none}}
.hint{position:absolute;z-index:3;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.7);opacity:calc(1 - var(--p,0)*6)}
.hint i{width:22px;height:34px;border:1.5px solid rgba(255,255,255,.55);border-radius:12px;position:relative}
.hint i::after{content:"";position:absolute;top:6px;left:50%;width:3px;height:7px;margin-left:-1.5px;border-radius:3px;background:var(--yellow);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

.rv{opacity:1;transform:none}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1)}
.js .rv.in{opacity:1;transform:none}

.benefit{transition:background .25s}
.benefit:hover{background:rgba(255,255,255,.08);border-color:rgba(255,188,0,.5)}
.benefit svg{transition:transform .3s}
.benefit:hover svg{transform:scale(1.18) rotate(-6deg)}

/* Countdown */
.next{padding-top:72px}
.next .card>*{position:relative;z-index:1}
.next .card{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;background:linear-gradient(135deg,var(--violet),var(--bg2) 75%);border-radius:20px;padding:32px 36px;position:relative;overflow:hidden}
.next .card::before{content:"";position:absolute;z-index:0;inset-inline-end:-170px;top:-190px;width:280px;height:280px;pointer-events:none;border-radius:50%;border:12px solid rgba(255,188,0,.9);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg);opacity:.9}
.next h2{font-size:clamp(24px,2.6vw,32px);margin:0 0 6px}
.next p{margin:0;color:#D7D6D6}
.clock{display:flex;gap:10px;direction:ltr;position:relative;z-index:1}
.clock div{min-width:78px;text-align:center;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.clock b{display:block;font:800 34px/1 var(--en);font-variant-numeric:tabular-nums}
.clock span{font-size:12px;color:var(--muted)}
.clock b.tick{animation:tick .35s}
@keyframes tick{0%{transform:translateY(-6px);opacity:.3}100%{transform:none;opacity:1}}

/* Frames: tilt + open */
.frame[data-open]{cursor:zoom-in;transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s}
.frame[data-open]:hover{box-shadow:0 40px 70px -24px rgba(255,188,0,.28),0 30px 60px -24px rgba(0,0,0,.8)}
.expand{position:absolute;z-index:3;top:14px;inset-inline-end:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:grid;place-items:center;opacity:0;transition:opacity .2s;pointer-events:none}
.frame:hover .expand{opacity:1}
@media (hover:none){.expand{opacity:1}}

/* Device switcher */
.tabs{display:inline-flex;gap:6px;background:rgba(255,255,255,.08);border-radius:14px;padding:5px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 15px var(--ar);padding:10px 18px;border-radius:10px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:background .2s,color .2s}
:host([lang="en"]) .tabs button{font-family:var(--en)}
.tabs button:hover{color:#fff}
.tabs button[aria-selected="true"]{background:var(--yellow);color:#101010}
.stage{margin:34px auto 0;display:flex;justify-content:center;align-items:flex-end;min-height:0}
.dev{position:relative;width:100%;transition:max-width .5s cubic-bezier(.22,1,.36,1)}
.dev .screen{position:relative;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px rgba(255,255,255,.22),0 30px 60px -24px rgba(0,0,0,.8);transition:border-radius .4s,border-width .4s,aspect-ratio .4s}
.dev .screen>img,.dev .screen>video{width:100%;height:100%;object-fit:cover;display:block}
.dev .base{margin:0 auto;background:#262861;transition:all .4s}
.dev .chrome{display:none;align-items:center;gap:6px;background:#262861;padding:9px 12px;direction:ltr}
.dev .chrome i{width:9px;height:9px;border-radius:50%;background:#E0298C}
.dev .chrome i:nth-child(2){background:#FFBC00}.dev .chrome i:nth-child(3){background:#D7D6D6}
.dev .chrome span{margin-inline-start:10px;flex:1;background:rgba(255,255,255,.1);border-radius:6px;padding:2px 10px;font:500 12px var(--en);color:#D7D6D6;text-align:left}
.dev[data-d="tv"]{max-width:880px}
.dev[data-d="tv"] .screen{aspect-ratio:16/9;border:8px solid #262861;border-radius:14px}
.dev[data-d="tv"] .base{width:28%;height:10px;border-radius:0 0 8px 8px}
.dev[data-d="phone"]{max-width:300px}
.dev[data-d="phone"] .screen{aspect-ratio:9/19;border:9px solid #262861;border-radius:40px;box-shadow:inset 0 0 0 2px #5B308E,0 0 0 1px rgba(255,255,255,.22),0 30px 60px -24px rgba(0,0,0,.8)}
.dev[data-d="phone"] .base{height:0}
.dev[data-d="tablet"]{max-width:640px}
.dev[data-d="tablet"] .screen{aspect-ratio:4/3;border:14px solid #262861;border-radius:26px;box-shadow:inset 0 0 0 2px #5B308E,0 0 0 1px rgba(255,255,255,.22),0 30px 60px -24px rgba(0,0,0,.8)}
.dev[data-d="tablet"] .base{height:0}
.dev[data-d="computer"]{max-width:880px}
.dev[data-d="computer"] .chrome{display:flex;border-radius:12px 12px 0 0}
.dev[data-d="computer"] .screen{aspect-ratio:16/9.6;border:0;border-radius:0 0 4px 4px;outline:6px solid #262861;outline-offset:-1px}
.dev[data-d="computer"] .base{width:112%;margin-inline:-6%;height:12px;border-radius:0 0 14px 14px}
.dcap{margin:22px auto 0;color:var(--muted);min-height:1.6em}

/* Lightbox */
dialog{border:0;padding:0;background:transparent;max-width:min(1200px,94vw);width:100%;margin:auto}
dialog::backdrop{background:rgba(12,20,35,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
dialog .box{position:relative;display:grid;place-items:center;width:fit-content;max-width:100%;margin:0 auto}
dialog video,dialog img{max-width:100%;max-height:86vh;object-fit:contain;display:block;border-radius:12px;background:transparent;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
dialog .vnav{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(12,20,35,.55);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,color .2s;z-index:2}
dialog .vnav:hover,dialog .vnav:focus-visible{background:var(--yellow);color:#101010}
dialog .vnav[hidden]{display:none}
dialog .vnav svg{width:18px;height:18px}
dialog .vprev{inset-inline-start:12px}
dialog .vnext{inset-inline-end:12px}
:host([dir="rtl"]) dialog .vnav svg{transform:scaleX(-1)}
dialog .x{position:absolute;top:-46px;inset-inline-end:0;background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:22px}
@media (max-width:860px){
dialog[open]{position:fixed;inset:0;margin:0;width:100%;max-width:100vw;height:100dvh;max-height:100dvh;overflow:hidden}
dialog .x{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;left:auto;inset-inline-end:auto;width:30px;height:30px;font-size:17px;line-height:1;z-index:5;background:rgba(12,20,35,.7);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;padding:0}
dialog .box,dialog .box.has-info{box-sizing:border-box;height:100dvh;max-height:100dvh;justify-content:flex-start;align-content:flex-start;align-items:stretch;overflow:auto;overscroll-behavior:contain;padding:calc(48px + env(safe-area-inset-top,0px)) 12px 18px;width:100%;gap:14px}
dialog .box:not(.has-info) img,dialog .box:not(.has-info) video{max-height:80dvh}
dialog .box.has-info img{max-height:56dvh}
}

/* Final CTA parallax */
.final .media img{transform:translateY(calc((var(--fp,.5) - .5)*-60px)) scale(1.12)}

@media (max-width:900px){
  .next .card{grid-template-columns:1fr;text-align:center;padding:26px 20px}
  .clock{justify-content:center}
  .clock div{min-width:64px}
  .clock b{font-size:28px}
  .tabs button{padding:9px 13px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:1;transform:none;transition:none}
  .hero .media{transform:none}.hero .copy{opacity:1;transform:none}
  .hint i::after{animation:none}.clock b.tick{animation:none}
  .dev,.dev *{transition:none!important}
}


/* UCL by the numbers */
.stats{text-align:center}
.stats .lead{margin-inline:auto}
.spanel{margin-top:26px;text-align:start}
.tabs.sub{display:flex;width:max-content;max-width:100%;margin:0 auto 18px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dh{padding:14px 20px 8px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:rgba(255,255,255,.03)}
.sbox>.dh:first-child{border-top:0}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line)}
.dh+.mrow{border-top:0}
.mrow .t{font-weight:700;font-size:16px}
.mrow .t.h{text-align:end}.mrow .t.a{text-align:start}
.mid{min-width:92px;display:flex;justify-content:center;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mid b{font-weight:900;font-size:17px}
.mid i{font-style:normal;color:var(--muted)}
.mid.up{color:var(--yellow);font-weight:800;font-size:15px}
.tblw{max-width:860px;margin-inline:auto;max-height:560px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{position:sticky;top:0;z-index:1;background:#262861;color:var(--muted);font-size:12.5px;font-weight:700;padding:11px 8px}
.tbl td{padding:11px 8px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{width:44px}
.tbl th.tn,.tbl td.tn{text-align:start;font-weight:700}
.tbl td.pts{font-weight:900;color:var(--yellow)}
.tbl tbody tr:hover{background:rgba(255,255,255,.04)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pcol h3{margin:0 0 12px;font-size:19px}
.prow{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--yellow);color:#101010;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pi{display:flex;flex-direction:column;line-height:1.3}
.pi b{font-weight:700}
.pi small{color:var(--muted);font-size:13px}
.sbox.narrow{max-width:860px;margin-inline:auto}
.cr{position:relative;flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;overflow:hidden}
.cr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:3px}
.cr em{font:800 9px var(--en);font-style:normal;color:var(--muted);letter-spacing:.02em}
.cr.ok{background:none}.cr.ok em{display:none}
.cr.sm{width:20px;height:20px}
.cr.sm em{display:none}
.cr.sm:not(.ok){display:none}
.mrow .t{display:flex;align-items:center;gap:10px}
.mrow .t.h{justify-content:flex-end}.mrow .t.a{justify-content:flex-start}
.tc{display:flex;align-items:center;gap:10px}
.pi small.tl{display:flex;align-items:center;gap:6px}
.snote{margin:18px auto 0;max-width:70ch;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.spanel>*{animation:spin .35s ease}@keyframes spin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (max-width:900px){
  .mrow{gap:8px;padding:12px 12px}
  .mrow .t{font-size:14px}
  .mid{min-width:72px;padding:5px 8px}
  .pgrid{grid-template-columns:1fr}
  .tbl{font-size:14px}

credit:"عرض الحملة من إعداد عبد الواحد عياطي",more:"يمكنك الاطلاع على المزيد من أعمالي",bfKick:"شرح الحملة",bfTitle:"حملة \"هنا ليالي الأبطال\"",bf1h:"الهدف والفكرة",bf1a:"الهدف: دعوة الجمهور لمشاهدة ومتابعة دوري أبطال أوروبا على منصة TOD، وترسيخ المنصة كوجهة البث الرسمي للمسابقة.",bf1b:"الفكرة: انطلقتُ من شعار المنصة نفسه \"هنا TOD\"، ووظّفتُ كلمة \"هنا\" كمحور للحملة بدءاً من اسمها. فهي تتكرر في العناوين والنصوص كإيقاع بصري ولفظي: هنا النجوم، هنا الأبطال، هنا ليالي أبطال أوروبا، هنا البث الرسمي. وفي كل تصميم تنتهي الرسالة عند الشعار \"هنا TOD\" وزر \"شاهد الآن\"، فيصل المشاهد من الإثارة إلى المكان الذي يعيشها فيه، ثم إلى فعل المشاهدة مباشرة.",bf1c:"أما \"ليالي الأبطال\" فهي العبارة التي يربطها الجمهور العربي بأجواء المسابقة وسهراتها الكبرى. وبجمعها مع \"هنا\" يصبح اسم الحملة وعداً واضحاً: هذه الليالي تُعاش على TOD.",bf2h:"العنصر البصري المشترك",bf2a:"اعتمدت الحملة على الخلفية المرسلة ضمن ملف المواد، وهي مبنية على أشكال كبسولية مائلة بزاوية 45 درجة، بأطراف دائرية تتناغم مع انحناءات شعار TOD. هذا الميلان يوحي بالحركة والتدفق، وهو معنى مناسب لمنصة بث ولإيقاع المباريات. لذلك اشتققتُ منه عنصراً بصرياً يتكرر في الحملة ويربط تصاميمها ببعض.",bf3h:"منهجية الإنتاج: صور اللاعبين",bf3a:"بسبب القيود المتعلقة بحقوق صور اللاعبين وعدم توفر صور مرخّصة بجودة إنتاجية، اعتمدتُ على الذكاء الاصطناعي لتوليد صور اللاعبين. ولضمان دقة الملامح وثباتها، لم أكتفِ بالتوليد المباشر، بل عملتُ على Character Sheet لكل لاعب بقميص فريقه، بزوايا ووضعيات متعددة. هذا ما سمح بالحفاظ على هوية كل لاعب عبر التصاميم الثلاثة، وبالتحكم في الوضعية والإضاءة بما يخدم التكوين.",bf3b:"في مرحلة التنفيذ الفعلي، تُستبدل هذه الصور بصور رسمية مرخّصة من beIN أو UEFA، مع الإبقاء على نفس التكوين والنظام البصري.",bf4h:"التصاميم الثلاثة: ثلاث مستويات من المعالجة",d1h:"1. \"هنا ليالي أبطال أوروبا\": التصميم الرئيسي (Key Visual)",d1a:"يحمل هذا التصميم اسم الحملة مباشرة، واعتمد على الدمج (Compositing): لاعبون من أبرز الأندية داخل ملعب واحد، تتوسطهم الكأس على محور عمودي يجمع العنوان والشعار والكأس.",d1b:"ويعبر التصميمَ خطٌّ مائل بلون TOD البنفسجي، مشتق من الأشكال الكبسولية في خلفية الهوية وبنفس زاويتها. ينطلق الخط من الزاوية اليمنى العليا ويتجه نحو الكأس، كأنه مسار ضوء يمتد من المنصة إلى قلب المسابقة. والفكرة أن TOD هي الطريق إلى ليالي الأبطال، وأن المشاهد يصل عبرها إلى الكأس واللحظات الكبرى. كما يقسم الخط المشهد بين أجواء الملعب ولون المنصة، فيجمع هوية المسابقة وهوية TOD في صورة واحدة.",d1c:"ويصلح هذا التصميم ليكون الواجهة الرئيسية للحملة، وهو قابل للتكييف لمختلف المقاسات.",d2h:"2. \"تابع أقوى فرق أوروبا\": نسخة هوية دوري الأبطال",d2a:"اخترتُ الأزرق عن قصد. هذه الألوان مرتبطة في ذهن الجمهور مباشرة بدوري أبطال أوروبا، فيبرز التصميم بقوة في الصفحة وسط المحتوى، ويمنح المشاهد ثقة فورية بأن ما يراه هو البث الرسمي وبجودة النقل.",d2b:"أما الخطوط الملونة المنحنية فمأخوذة من الهوية البصرية الرسمية لدوري أبطال أوروبا (دورة 2024–2027)، التي صممها استوديو Vasava بالتعاون مع UEFA تحت مفهوم \"Kick of Light\" القائم على انكسار الضوء، حيث ترمز الألوان إلى تنوع الأندية المشاركة. وقد وظّفتُ هذه الخطوط لتقريب التصميم من اللغة البصرية التي يعرفها الجمهور في البث والملاعب. وفي التنفيذ الفعلي تُعتمد الأصول الرسمية من دليل هوية UEFA المتاح للناقلين.",d2c:"وبقيت عناصر TOD ثابتة (الشعار الذهبي، زر المشاهدة، صيغة \"هنا\") لتربط التصميم بالمنصة وبالحملة.",d3h:"3. \"عِش دوري أبطال أوروبا\": نسخة هوية TOD",d3a:"بُني هذا التصميم مباشرة على خلفية الهوية، التزاماً بألوان TOD البنفسجية والذهبية، ليكون الأقرب إلى العلامة التجارية للمنصة.",d3b:"وظّفتُ الشكلين الكبسوليين المائلين كمسارين يقودان التكوين، فيتوزع نجوم المسابقة في كتلتين، كل كتلة تتبع أحد الشكلين في اتجاه الحركة. ويفصل بينهما فراغ مائل يمنح التصميم إحساس الاندفاع والتدفق، ويُبرز شكل الهوية نفسه بدل أن تغطيه الصور. وبهذا يصبح توزيع اللاعبين امتداداً للهوية وليس مجرد تجميع للصور. وفي مقدمة الكتلة الثانية يقف حكيمي كنقطة جذب رئيسية، قريباً من الجمهور العربي، يقود العين من الصورة نحو النص.",d3c:"وعلى اليمين يستقر العمود النصي في المساحة الهادئة، بتسلسل واضح: عنوان \"عِش دوري أبطال أوروبا\" الذي يحوّل المشاهدة إلى تجربة تُعاش، ثم صيغة \"هنا\": هنا النجوم، هنا الأبطال، هنا البث الرسمي من beIN SPORTS. وينتهي العمود بشعار \"هنا TOD\" وزر \"شاهد الآن\"، فتنتقل الرسالة من الإثارة إلى المكان، ثم إلى فعل المشاهدة مباشرة.",bf5h:"الخلاصة",bf5a:"ثلاث معالجات لرسالة واحدة: هنا ليالي الأبطال… هنا TOD.",bf5b:"تصميم مركّب يصنع الحدث، وتصميم بهوية المسابقة يبني الثقة، وتصميم بهوية المنصة يرسّخ العلامة. ويربط الشكلُ المائل المشتق من هوية TOD بين التصميمين الأول والثالث، بينما تجمع صيغة \"هنا\" والشعار وزر المشاهدة التصاميم الثلاثة في نظام واحد. والنظام كله قابل للتوسيع إلى مقاسات السوشيال ميديا (Story وPost وBanner) وإلى الحملات المستقبلية على المنصة.",bfBtn:"اقرأ شرح الحملة كاملاً",viK:"التصميم {n} من 3",dcN1:"هنا ليالي أبطال أوروبا",dcN2:"تابع أقوى فرق أوروبا",dcN3:"عِش دوري أبطال أوروبا",bfFig:"نموذج Character Sheet للاعب: لقطة قريبة للوجه، ثم 3/4، ثم منظر أمامي وجانبي وخلفي بقميص فريقه.",add:"أضف ملفاً للمعاينة",missing:"مكان",langBtn:"EN",title:"دوري أبطال أوروبا على TOD"},
en:{navHome:"Home",navSport:"Sports",navLive:"Live",navEnt:"Entertainment",navKids:"Kids",signIn:"Sign in",subscribe:"Subscribe now",
heroTitle:"UEFA Champions League on TOD",heroText:"Every match from Europe’s biggest stage, live and on demand.",watchPromo:"Watch the promo",

railStatics:"Campaign key visuals",ctxTitle:"One campaign. Every size.",ctxText:"The same visual world, reshaped for each format — from Story to Post to Video — without losing identity or the strength of the message.",
aboutTitle:"About this work",aboutText1:"A creative campaign promoting the UEFA Champions League on TOD, with two promos of 15 and 6 seconds and three static key visuals in different formats. The goal is a premium, dynamic visual experience that captures the scale and excitement of the competition, with TOD’s identity in every detail.",
dRole:"Test",vRole:"Creative Producer, TOD by beIN",dBy:"By",vBy:"Abdelouahed Ayati",dLine:"Campaign line",dDel:"Deliverables",vDel:"15s promo, 6s promo and 3 static key visuals",
fAbout:"About",fFaq:"FAQ",fTerms:"Terms",fNote:"Concept presentation for a job test, not an official TOD page.",
credit:"Campaign presentation by Abdelouahed Ayati",more:"See more of my work",bfKick:"Campaign brief",bfTitle:"Campaign “Right Here: The Champions Nights”",bf1h:"Goal and idea",bf1a:"Goal: to invite audiences to watch and follow the UEFA Champions League on the TOD platform, and to establish the platform as the official broadcast destination for the competition.",bf1b:"Idea: I started from the platform’s own line, “It’s all TOD”, and made the word “here” the axis of the campaign, starting with its name. It repeats across headlines and copy as a visual and verbal rhythm: here the stars, here the champions, here the nights of Europe’s champions, here the official broadcast. In every design the message ends at the “It’s all TOD” sign-off and the “Watch now” button, so the viewer travels from the excitement to the place where it is lived, then straight to the act of watching.",bf1c:"“Champions Nights” is the phrase Arabic-speaking audiences link with the atmosphere and big evenings of the competition. Combined with “here”, the campaign name becomes a clear promise: these nights are lived on TOD.",bf2h:"The shared visual element",bf2a:"The campaign relied on the background supplied in the materials file, built on capsule shapes tilted at 45 degrees, with rounded ends that echo the curves of the TOD logo. The tilt suggests movement and flow, a fitting meaning for a streaming platform and the rhythm of matches. I therefore derived a visual element from it that repeats across the campaign and ties its designs together.",bf3h:"Production method: player images",bf3a:"Because of image-rights restrictions on players, and the lack of licensed images in production quality, I relied on AI to generate the player images. To keep faces accurate and consistent, I did not settle for direct generation; I built a Character Sheet for each player in his team kit, with multiple angles and poses. This kept each player’s identity consistent across the three designs and gave control over pose and lighting to serve the composition.",bf3b:"At actual production, these images are replaced with official licensed images from beIN or UEFA, keeping the same composition and visual system.",bf4h:"The three designs: three levels of treatment",d1h:"1. “Right Here: Europe’s Champions Nights” — the main design (Key Visual)",d1a:"This design carries the campaign name directly and uses compositing: players from top clubs inside one stadium, with the trophy at the centre on a vertical axis that gathers the headline, the logo and the trophy.",d1b:"A diagonal line in TOD purple crosses the design, derived from the capsule shapes in the identity background and at the same angle. It starts at the upper right corner and heads toward the trophy, like a path of light extending from the platform to the heart of the competition. The idea is that TOD is the road to the Champions nights, and through it the viewer reaches the trophy and the big moments. The line also divides the scene between the stadium atmosphere and the platform colour, joining the competition’s identity and TOD’s in one image.",d1c:"This design suits as the campaign’s main face, and it adapts to different sizes.",d2h:"2. “Follow Europe’s strongest teams” — the Champions League identity version",d2a:"I chose blue deliberately. These colours are linked in the audience’s mind directly with the UEFA Champions League, so the design stands out strongly on the page among other content and gives the viewer instant confidence that what they see is the official broadcast, in broadcast quality.",d2b:"The curved coloured lines are taken from the official visual identity of the UEFA Champions League (2024–2027 cycle), designed by studio Vasava in collaboration with UEFA under the concept “Kick of Light”, based on the refraction of light, where the colours symbolise the diversity of the participating clubs. I used these lines to bring the design closer to the visual language the audience knows from broadcasts and stadiums. In actual execution, the official assets from the UEFA identity guide available to broadcasters are used.",d2c:"The TOD elements remained constant (the golden logo, the watch button, the “here” phrasing) to tie the design to the platform and the campaign.",d3h:"3. “Live the UEFA Champions League” — the TOD identity version",d3a:"This design is built directly on the identity background, keeping to TOD’s purple and gold colours, to be closest to the platform’s brand.",d3b:"I used the two tilted capsule shapes as two paths that lead the composition, so the competition’s stars are distributed in two blocks, each following one shape in the direction of movement. A tilted gap separates them, giving a sense of drive and flow and showing the identity shape itself rather than covering it with images. The players’ distribution thus becomes an extension of the identity, not just a collage of pictures. At the front of the second block stands Hakimi as the main focal point, close to the Arab audience, leading the eye from the image to the text.",d3c:"On the right, the text column sits in the calm space, in a clear sequence: the headline “Live the UEFA Champions League”, which turns watching into an experience, then the “here” lines: here the stars, here the champions, here the official broadcast from beIN SPORTS. The column ends with the “It’s all TOD” sign-off and the “Watch now” button, so the message moves from excitement to place, then straight to the act of watching.",bf5h:"Conclusion",bf5a:"Three treatments for one message: Here are the Champions nights… It’s all TOD.",bf5b:"A composited design that makes the event, a design in the competition’s identity that builds trust, and a design in the platform’s identity that anchors the brand. The tilted shape derived from TOD’s identity links the first and third designs, while the “here” phrasing, the logo and the watch button bring all three designs into one system. The whole system can scale to social media sizes (Story, Post and Banner) and to future campaigns on the platform.",bfBtn:"Read the full campaign brief",viK:"Design {n} of 3",dcN1:"Right Here: Europe’s Champions Nights",dcN2:"Follow Europe’s strongest teams",dcN3:"Live the UEFA Champions League",bfFig:"A sample Character Sheet: face close-up, 3/4 close-up, then front, side and back views in the team kit.",add:"Add a file to preview",missing:"Slot",langBtn:"عربي",title:"UEFA Champions League on TOD"}
};
let lang="ar";
const local={}; // files picked in the browser for preview

function mediaEl(key){
  const a=ASSETS[key], src=local[key]?.url||(lang==="en"&&a.en)||a.src, type=local[key]?.type||a.type;
  if(type==="video"){
    const v=document.createElement("video");
    Object.assign(v,{src,muted:true,loop:true,playsInline:true,autoplay:key==="hero"});
    if(a.poster&&!local[key]) v.poster=a.poster;
    v.onerror=()=>{ if(a.fb&&!local[key]){const im=document.createElement("img");im.src=a.fb;im.alt="";im.onerror=()=>slot(key);v.replaceWith(im);} else slot(key); }; return v;
  }
  const i=document.createElement("img"); i.src=src; i.alt=""; i.onerror=()=>{ if(a.fb&&i.getAttribute("src")!==a.fb&&!local[key]) i.src=a.fb; else slot(key); }; return i;
}
function slot(key){
  const host=root.querySelector(`[data-slot="${key}"]`); if(!host) return;
  const a=ASSETS[key], id="f_"+key;
  host.innerHTML=`<div class="slot"><div><b class="en">${a.size}</b><span class="en">${a.src}</span><br>
    <label for="${id}">${T[lang].add}</label><input id="${id}" type="file" accept="${a.type==="video"?"video/*":"image/*"}"></div></div>`;
  host.querySelector("input").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    local[key]={url:URL.createObjectURL(f),type:f.type.startsWith("video")?"video":"image"};
    // share one picked file with its sibling slots
    const twins={kv16:["hero","promo15thumb","hd"],st:["st","story"],story:["st","story"],hd:["hd","promo15thumb"],promo15:["promo15","hero"]};
    (twins[key]||[]).forEach(k=>{local[k]=local[key];});
    if(key==="hero"&&local[key].type==="video") local.promo15=local[key];
    fill();
  };
  host.querySelector("label").onclick=e=>e.stopPropagation();
}
const navAs=[...root.querySelectorAll("a[data-nav]")];
function setView(b,scroll){host.setAttribute("data-view",b?"brief":"home");const d=root.querySelector(".bf-more");if(d)d.open=b;navAs.forEach(x=>x.toggleAttribute("aria-current",(x.dataset.nav==="brief")===b));if(scroll)scrollTo({top:0,behavior:"smooth"});}
host.__setView=setView;
(function(){const b=root.getElementById("hsound"), hero=root.querySelector(".hero"); if(!b||!hero) return;
  const vid=()=>root.querySelector('.hero [data-slot="hero"] video');
  b.classList.add("hint");
  b.addEventListener("click",()=>{const v=vid(); if(!v) return; b.classList.remove("hint"); v.muted=!v.muted; if(!v.muted){v.volume=.8; v.currentTime=0; const p=v.play(); if(p&&p.catch)p.catch(()=>{});} root.querySelector(".s-off").hidden=!v.muted; root.querySelector(".s-on").hidden=v.muted;});
  const mute=()=>{const v=vid(); if(v&&!v.muted){v.muted=true; root.querySelector(".s-off").hidden=false; root.querySelector(".s-on").hidden=true;}};
  new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting) mute();}),{threshold:.15}).observe(hero);
  document.addEventListener("visibilitychange",()=>{if(document.hidden) mute();});
  root.addEventListener("click",e=>{if(e.target.closest("[data-open]")) mute();},true);
  setInterval(()=>{const v=vid(); b.hidden=!v; if(v){root.querySelector(".s-off").hidden=!v.muted; root.querySelector(".s-on").hidden=v.muted;}},1000);
})();
(function(){const c0=root.getElementById("dcar"); if(!c0) return; const grp=c0.closest(".formats"), c=grp;
  const sets=[...root.querySelectorAll(".dc-view")].map(v=>[...v.querySelectorAll(".dc-slide")]), dots=[...c.querySelectorAll(".dc-dots i")], N=3; let n=0,hold=0;
  const bars=[...root.querySelectorAll(".phone .bar i")];
  const show=i=>{n=(i+N)%N; sets.forEach(sl=>sl.forEach((x,k)=>x.classList.toggle("on",k===n))); dots.forEach((x,k)=>x.classList.toggle("on",k===n)); bars.forEach((b,k)=>{b.classList.toggle("done",k<n); b.classList.toggle("on",k===n);});};
  const tick=()=>{ if(hold||document.hidden||host.hidden||host.getAttribute("data-view")==="brief") return; const r=grp.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return; show(n+1); };
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!reduce) setInterval(tick,4500);
  const manual=d=>{show(n+d); hold=1; clearTimeout(manual.t); manual.t=setTimeout(()=>hold=0,9000);};
  c.querySelector(".dc-prev").addEventListener("click",()=>manual(-1));
  c.querySelector(".dc-next").addEventListener("click",()=>manual(1));
  grp.addEventListener("pointerenter",()=>hold=1); grp.addEventListener("pointerleave",()=>{clearTimeout(manual.t); hold=0;});
})();
navAs.forEach(a=>a.addEventListener("click",e=>{e.preventDefault();const b=a.dataset.nav==="brief";setView(b,true);try{history.replaceState(null,"",b?"#brief":location.pathname+location.search)}catch(err){}}));
const hsnd=root.getElementById("hsound");
function syncSound(){const v=root.querySelector('.hero [data-slot="hero"] video'); if(!hsnd) return; hsnd.hidden=!v; if(v){root.querySelector(".s-off").hidden=!v.muted; root.querySelector(".s-on").hidden=v.muted;}}
function fill(){
  root.querySelectorAll("[data-slot]").forEach(h=>{h.innerHTML="";h.appendChild(mediaEl(h.dataset.slot));});
  syncSound(); setTimeout(syncSound,300);
}
function setLang(l){
  lang=l; const h=document.documentElement; h.lang=l; h.dir=l==="ar"?"rtl":"ltr"; host.setAttribute("lang",l); host.setAttribute("dir",h.dir);
  root.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[l][el.dataset.t]);
  window.todMark(root);
  const lb=root.getElementById("lang"); lb.textContent=T[l].langBtn; lb.style.fontFamily=l==="ar"?"var(--en)":"var(--ar)"; lb.style.fontSize=l==="ar"?"14px":"16px";
  document.title=T[l].title;
  root.querySelectorAll(".slot label").forEach(x=>x.textContent=T[l].add);
  root.querySelectorAll("[data-slot]").forEach(h=>{const a=ASSETS[h.dataset.slot]; if(a&&a.en&&!local[h.dataset.slot]){h.innerHTML="";h.appendChild(mediaEl(h.dataset.slot));}});
  root.querySelectorAll("a[data-more]").forEach(x=>x.href="https://a-ayati.github.io/?lang="+l);
}
root.getElementById("lang").onclick=()=>window.__applyLang(lang==="ar"?"en":"ar");

const dlg=root.getElementById("viewer"), vb=root.getElementById("vbody");
let _sy=0;
function lockScroll(on){const d=document.documentElement,b=document.body;
  if(on){_sy=scrollY;d.style.overflow="hidden";b.style.overflow="hidden";b.style.position="fixed";b.style.top=(-_sy)+"px";b.style.width="100%";}
  else{d.style.overflow="";b.style.overflow="";b.style.position="";b.style.top="";b.style.width="";scrollTo(0,_sy);}
}
function lbNav(groups,getKey,openKey){
  const box=dlg.querySelector(".vstage")||dlg.querySelector(".box"); const mk=(c,path)=>{const b=document.createElement("button");b.type="button";b.className="vnav "+c;b.setAttribute("aria-label",c==="vprev"?"Previous":"Next");b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+path+'"/></svg>';box.appendChild(b);return b;};
  const pv=mk("vprev","m15 6-6 6 6 6"), nx=mk("vnext","m9 6 6 6-6 6");
  const grp=()=>groups.find(g=>g.includes(getKey()));
  const upd=()=>{const on=!!grp(); pv.hidden=nx.hidden=!on;};
  const step=d=>{const g=grp(); if(!g) return; openKey(g[(g.indexOf(getKey())+d+g.length)%g.length]);};
  pv.onclick=e=>{e.stopPropagation();step(-1)}; nx.onclick=e=>{e.stopPropagation();step(1)};
  dlg.addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return; const rtl=document.documentElement.dir==="rtl"; step((e.key==="ArrowRight")===!rtl?1:-1);});

let mqAnim=null, mqIO=null, mqRz=0;
function wireCarousel(){
  if(mqAnim){mqAnim.cancel(); mqAnim=null;}
  if(mqIO){mqIO.disconnect(); mqIO=null;}
  const w=stPanel.querySelector(".carw"); if(!w) return;
  const tr=w.querySelector(".track"), trk=w.querySelector(".trk"), pv=w.querySelector(".cb-prev"), nx=w.querySelector(".cb-next");
  trk.querySelectorAll("[data-clone]").forEach(n=>n.remove());
  tr.classList.remove("mq");
  const cards=[...trk.children], rtl=getComputedStyle(tr).direction==="rtl";
  const cw=cards[0]?cards[0].offsetWidth:0, step=()=>cw+14;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches||cards.length<2){
    /* no motion: plain scrollable row */
    const sg=rtl?-1:1;
    pv.onclick=()=>tr.scrollBy({left:-sg*(step()||200),behavior:"smooth"});
    nx.onclick=()=>tr.scrollBy({left:sg*(step()||200),behavior:"smooth"});
    return;
  }
  if(!cw||!tr.clientWidth) return;   /* view not visible yet: it is rebuilt when shown */
  /* endless slow marquee: English right to left, Arabic left to right, never stops */
  const setW=cards.length*step();
  const copies=Math.max(2,Math.ceil(tr.clientWidth/setW)+1);
  for(let k=0;k<copies;k++) cards.forEach(c=>{const n=c.cloneNode(true); n.setAttribute("aria-hidden","true"); n.dataset.clone="1"; trk.appendChild(n);});
  wireCrests();
  tr.classList.add("mq");
  const speed=34, D=setW/speed*1000;
  mqAnim=trk.animate([{transform:"translateX(0)"},{transform:"translateX("+(rtl?setW:-setW)+"px)"}],{duration:D,iterations:Infinity,easing:"linear"});
  const nudge=dir=>{
    const a=mqAnim, from=a.currentTime||0, extra=step()/speed*1000*dir, t0=performance.now(), dur=420;
    const f=now=>{ if(a!==mqAnim) return; const el=Math.max(0,now-t0), k=Math.min(1,el/dur), e=1-Math.pow(1-k,3);
      a.currentTime=(((from+el+extra*e)%D)+D)%D; if(k<1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  };
  pv.onclick=()=>nudge(-1);
  nx.onclick=()=>nudge(1);
  mqIO=new IntersectionObserver(es=>{ if(es[0].isIntersecting&&!host.hidden) mqAnim.play(); else mqAnim.pause(); });
  mqIO.observe(w);
}

const LIVE={base:"https://site.api.espn.com/apis",league:"soccer/uefa.champions",seasonStart:"20260901",fast:120000,slow:1800000};
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const NAME2CODE={}; Object.keys(TM).forEach(c=>{NAME2CODE[norm(TM[c][1])]=c;});
Object.assign(NAME2CODE,{"internazionale":"INT","inter milan":"INT","lask linz":"ASK","feyenoord rotterdam":"FEY","sabah fk":"SBH","viking fk":"VIK","bodo glimt":"BOG","as roma":"ROM","fc barcelona":"BAR","fc porto":"FCP","rc lens":"RCL","sporting":"SPO","vfb stuttgart":"VFB","atletico madrid":"ATM","shakhtar":"SHA","slavia praha":"SLA"});
const PLAR={}; Object.keys(PL).forEach(k=>{PLAR[norm(PL[k][1])]=PL[k][0];});
function teamCode(t){
  const n=norm(t.displayName||t.name); let c=NAME2CODE[n];
  if(!c){ c=String(t.abbreviation||n.slice(0,3)).toUpperCase(); if(!TM[c]) TM[c]=[t.displayName||t.name,t.displayName||t.name]; NAME2CODE[n]=c; }

const evs=new Map();
function ingest(json){
  (json.events||[]).forEach(e=>{
    const c=e.competitions&&e.competitions[0]; if(!c||!c.competitors) return;
    const h=c.competitors.find(x=>x.homeAway==="home"), a=c.competitors.find(x=>x.homeAway==="away"); if(!h||!a) return;
    const hc=teamCode(h.team), ac=teamCode(a.team), idc={}; idc[h.team.id]=hc; idc[a.team.id]=ac;
    const goals=(c.details||[]).filter(d=>d.scoringPlay&&!d.ownGoal&&!d.shootout&&d.athletesInvolved&&d.athletesInvolved[0]).map(d=>({n:d.athletesInvolved[0].displayName,t:idc[d.team&&d.team.id]||hc}));
    evs.set(e.id,{d:e.date,st:c.status&&c.status.type&&c.status.type.state,hc,ac,hs:+h.score||0,as:+a.score||0,clock:c.status&&c.status.displayClock,goals});
  });

function deriveLive(){
  const all=[...evs.values()], byDate=(a,b)=>new Date(a.d)-new Date(b.d);
  const past=all.filter(x=>x.st==="post").sort(byDate);
  const now=all.filter(x=>x.st==="in").sort(byDate);
  const pre=all.filter(x=>x.st==="pre").sort(byDate);
  if(past.length) RESULTS=past.map(x=>[x.d,x.hc,x.hs,x.ac,x.as]);
  if(now.length||pre.length) UPCOMING=now.map(x=>[x.d,x.hc,x.ac,{hs:x.hs,as:x.as,clock:x.clock}]).concat(pre.map(x=>[x.d,x.hc,x.ac]));
  const g={};
  all.filter(x=>x.st!=="pre").forEach(x=>x.goals.forEach(o=>{const k=norm(o.n); (g[k]=g[k]||{n:o.n,t:o.t,c:0}).c++;}));
  const top=Object.values(g).sort((a,b)=>b.c-a.c||a.n.localeCompare(b.n)).slice(0,10);
  if(top.length) SCORERS=top.map(o=>{const k="l_"+norm(o.n).replace(/ /g,"_"); PL[k]=[PLAR[norm(o.n)]||o.n,o.n,o.t]; return [k,o.c];});
}
async function loadStandings(){
  const r=await fetch(LIVE.base+"/v2/sports/"+LIVE.league+"/standings"); if(!r.ok) throw new Error("standings");
  const j=await r.json(), ent=j.children&&j.children[0]&&j.children[0].standings&&j.children[0].standings.entries;
  if(!ent||!ent.length) return;
  const val=(e,n)=>{const x=(e.stats||[]).find(y=>y.name===n); return x?+x.value:0;};
  STANDINGS=ent.map(e=>[val(e,"rank"),teamCode(e.team),val(e,"wins"),val(e,"ties"),val(e,"losses"),val(e,"points")]).sort((a,b)=>a[0]-b[0]);
}
async function loadBoard(range){

const ymd=d=>d.toISOString().slice(0,10).replace(/-/g,"");
async function refreshLive(full){

  refreshLive(full);
}
tick(); setInterval(tick,LIVE.fast);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) tick();});

/* ===== Scattered words under the countdown ===== */
const wordsEl=root.getElementById("words");
function buildWords(){
  const r=k=>{const x=Math.sin(k*127.1+311.7)*43758.5453; return x-Math.floor(x);};
  wordsEl.querySelectorAll("[data-w]").forEach((h,g)=>{
    const words=String(T[lang][h.dataset.w]||"").split(/\s+/).filter(Boolean);
    h.innerHTML=words.map((w,j)=>{const k=g*17+j*5; return `<span class="w" style="--i:${g*3+j};--x:${Math.round((r(k)-.5)*340)}px;--y:${Math.round((r(k+2)-.5)*280)}px;--r:${Math.round((r(k+4)-.5)*56)}deg">${w}</span>`;}).join(" ");
    h.setAttribute("aria-label",words.join(" "));
    const k0=g*17, wg=h.parentNode; wg.style.setProperty("--gx",Math.round((r(k0)-.5)*340)+"px"); wg.style.setProperty("--gy",Math.round((r(k0+2)-.5)*280)+"px"); wg.style.setProperty("--gr",Math.round((r(k0+4)-.5)*56)+"deg");
  });
}
(function(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches||!("IntersectionObserver" in window)) return;
  wordsEl.classList.add("arm");
  const groups=[...wordsEl.querySelectorAll(".wg")];
  /* each phrase scatters and re-assembles every time the customer scrolls past it */
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting&&e.intersectionRatio>=.35) e.target.classList.add("in");
    else if(!e.isIntersecting) e.target.classList.remove("in");
  }),{threshold:[0,.35],rootMargin:"-6% 0px -6% 0px"});
  groups.forEach(g=>io.observe(g));
  /* and keep drifting sideways while it passes */
  let raf=0;
  const drift=()=>{raf=0; if(host.hidden) return; const vh=innerHeight;
    groups.forEach((g,i)=>{const r=g.getBoundingClientRect(); const p=Math.max(-1,Math.min(1,((r.top+r.height/2)-vh/2)/(vh/2))); g.style.setProperty("--sx",(p*(i===1?-46:i===0?46:26)).toFixed(1)); g.style.setProperty("--s",Math.max(0,Math.min(1,(p>0?(p-.45)/.5:(-p-.82)/.3))).toFixed(3));});};
  addEventListener("scroll",()=>{if(!raf) raf=requestAnimationFrame(drift);},{passive:true}); drift();
  if(matchMedia("(hover:hover)").matches){
    wordsEl.addEventListener("pointermove",e=>{const bb=wordsEl.getBoundingClientRect(); wordsEl.style.setProperty("--px",((e.clientX-bb.left)/bb.width-.5).toFixed(3)); wordsEl.style.setProperty("--py",((e.clientY-bb.top)/bb.height-.5).toFixed(3));});
    wordsEl.addEventListener("pointerleave",()=>{wordsEl.style.setProperty("--px",0); wordsEl.style.setProperty("--py",0);});
  }
})();
buildWords();

const _setLang3=setLang; setLang=function(l){_setLang3(l); renderStats(); buildWords();};
renderStats();

return {
  setLang:l=>setLang(l),
  pause(){root.querySelectorAll("video").forEach(v=>{v.pause()}); root.querySelectorAll("dialog[open]").forEach(d=>d.close());},
  resume(){root.querySelectorAll("video").forEach(v=>{if(v.autoplay){const p=v.play(); if(p&&p.catch)p.catch(()=>{})}}); onScroll(); tickClock(); tick(); wireCarousel();}
};
})(srL,hLand);

const sw=document.getElementById("switch"), swIc=document.getElementById("sw-ic"), swT=document.getElementById("sw-t"), wipe=document.getElementById("wipe");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

let peekT;
function peek(){sw.classList.add("peek");clearTimeout(peekT);peekT=setTimeout(()=>sw.classList.remove("peek"),3200);}
function paintSwitch(){
  const t=L[lang];
  swIc.innerHTML=mode==="show"?EYE:BACK;
  swT.textContent=mode==="show"?t.toLand:t.toShow;
  const tip=mode==="show"?t.toLandT:t.toShowT;
  sw.title=tip; sw.setAttribute("aria-label",tip);
  document.title=t.title;
}
window.__applyLang=function(l){
  lang=l; V1.setLang(l); V2.setLang(l); paintSwitch();
  try{localStorage.setItem("tod-lang",l)}catch(e){}
};
function syncSticky(){document.body.classList.toggle("sticky-on",mode==="land"&&scrollY>innerHeight*.7);}
addEventListener("scroll",syncSticky,{passive:true}); addEventListener("resize",syncSticky);
function swap(m){
  mode=m;
  if(m==="show"&&hShow.__setView) hShow.__setView(false,false);
  hShow.hidden=m!=="show"; hLand.hidden=m!=="land";
  document.body.classList.toggle("mode-land",m==="land");
  (m==="show"?V2:V1).pause();
  (m==="show"?V1:V2).resume();
  scrollTo(0,0); syncSticky();
  paintSwitch(); peek();
  try{history.replaceState(null,"",m==="land"?"#customer":(hShow.getAttribute("data-view")==="brief"?"#brief":location.pathname+location.search))}catch(e){}
}
async function go(m){
  if(m===mode) return;
  if(reduce||!wipe.animate){swap(m);return;}
  const r=sw.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  const from=`circle(0px at ${x}px ${y}px)`, to=`circle(150vmax at ${x}px ${y}px)`;
  wipe.style.clipPath=from;
  await wipe.animate([{clipPath:from},{clipPath:to}],{duration:520,easing:"cubic-bezier(.7,0,.25,1)",fill:"forwards"}).finished;
  swap(m);
  await wipe.animate([{opacity:1},{opacity:0}],{duration:380,easing:"ease-out",fill:"forwards"}).finished;
  wipe.getAnimations().forEach(a=>a.cancel());
  wipe.style.clipPath="circle(0 at 50% 50%)";
}
sw.addEventListener("click",()=>go(mode==="show"?"land":"show"));

let saved=null; try{saved=localStorage.getItem("tod-lang")}catch(e){}
window.__applyLang(saved==="en"?"en":"ar");
V2.pause(); peek();
function route(){
  const h=location.hash;
  if(h==="#customer"){ if(mode!=="land") swap("land"); return; }
  if(mode!=="show") swap("show");
  if(hShow.__setView) hShow.__setView(h==="#brief",false);
}
if(location.hash==="#customer"||location.hash==="#brief") route();
addEventListener("hashchange",route);
})();
</script>
